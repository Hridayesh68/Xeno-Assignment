# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, aligned with backend root
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# limit the number of displayed characters of the version revision in 'alembic history'
# version_locations =

# version path separator; defaults to OS-specific path separator
# version_path_separator =

# logging configuration
# (configured via [loggers] sections below)

[post_write_hooks]
# post_write_hooks defines scripts or methods that are run after
# a revision is generated.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
