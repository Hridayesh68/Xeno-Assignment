version: '3.8'

services:
  crm-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-api
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  channel-service:
    build:
      context: ./channel-stub
      dockerfile: Dockerfile
    container_name: channel-service
    restart: unless-stopped
    expose:
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # Route receipt callbacks through the internal Docker network for lower latency
      - CRM_RECEIPT_URL=http://crm-api:8000/api/receipt
      - PORT=8001
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./certs-data:/var/www/certbot:ro
    depends_on:
      - crm-api
      - channel-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
