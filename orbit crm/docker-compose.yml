services:
  crm-api:
    image: ${DOCKERHUB_USERNAME}/crm-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-api
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  channel-service:
    image: ${DOCKERHUB_USERNAME}/channel-service:latest
    build:
      context: ./channel-stub
      dockerfile: Dockerfile
    container_name: channel-service
    restart: unless-stopped
    expose:
      - "8001"
    ports:
      - "8001:8001"
    environment:
      # Route receipt callbacks through the internal Docker network for lower latency
      - CRM_RECEIPT_URL=http://crm-api:8000/api/receipt
      - PORT=8001
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
