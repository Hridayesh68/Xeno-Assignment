name: Xeno CRM CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint, Test, and Build Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv (Fast Package Manager)
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/requirements.txt"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Local Dependencies
        run: |
          cd "orbit crm/backend"
          uv venv
          uv pip install -r requirements.txt

      - name: Docker Build Test (Lightweight Verification)
        run: |
          cd "orbit crm"
          docker build -t crm-api:test ./backend
          docker build -t channel-service:test ./channel-stub
          docker build -t crm-frontend:test ./frontend

  deploy-backend:
    name: Deploy Backend to AWS EC2
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: 'ssh workflow docker backend'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Keys for AWS EC2 Connection
        env:
          SSH_KEY: ${{ secrets.SSH_SECRET_ENV }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Connect and Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "
            cd /home/ubuntu/orbit-crm || git clone https://github.com/${{ github.repository }} /home/ubuntu/orbit-crm
            cd /home/ubuntu/orbit-crm
            git pull origin main
            
            # Navigate to the directory containing docker-compose.yml
            cd 'orbit crm'
            
            # Ensure .env file exists for docker-compose to find
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Re-build and re-launch containers gracefully using sudo to prevent permission denied errors
            sudo docker compose down
            sudo docker compose up --build -d
            
            # Wait for DB and container to be up
            echo 'Waiting for containers to start...'
            sleep 10
            
            # Execute database migrations automatically inside the container
            sudo docker compose exec -T crm-api alembic upgrade head
            
            # Run the seed script to seed the data if the database is fresh
            sudo docker compose exec -T crm-api python seed.py
            
            # Verify container health status
            sudo docker compose ps
          "

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
